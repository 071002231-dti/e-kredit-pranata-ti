services:
  # =============================================================================
  # Main Application (e-kredit)
  # =============================================================================
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: e-kredit-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-e_kredit}
      - DB_USERNAME=${DB_USERNAME:-e_kredit}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - WHATSAPP_SERVICE_URL=http://whatsapp-service
      - WHATSAPP_SERVICE_KEY=${WHATSAPP_SERVICE_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    volumes:
      - ./backend/storage:/var/www/html/storage
      - ./backend/public:/var/www/html/public
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # Main app queue worker
  app-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: e-kredit-worker
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-e_kredit}
      - DB_USERNAME=${DB_USERNAME:-e_kredit}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - WHATSAPP_SERVICE_URL=http://whatsapp-service
      - WHATSAPP_SERVICE_KEY=${WHATSAPP_SERVICE_KEY}
    volumes:
      - ./backend/storage:/var/www/html/storage
    networks:
      - app-network
    depends_on:
      - mysql
      - redis

