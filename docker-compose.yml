  # =============================================================================
  # Redis (Shared)
  # =============================================================================
  redis:
    image: redis:alpine
    container_name: e-kredit-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
  # whatsapp-db-data:  # DISABLED
  redis-data:
