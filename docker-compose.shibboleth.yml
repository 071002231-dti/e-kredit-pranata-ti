version: '3.9'

# Shibboleth SP 3.4.1 SSO Integration for e-Kredit Pranata TI
# This compose file adds Shibboleth SP container and Nginx with FastCGI support
# to the existing e-kredit infrastructure

networks:
  ekredit-network:
    driver: bridge

volumes:
  shibboleth-config:
    driver: local
  shibboleth-metadata:
    driver: local
  shibboleth-logs:
    driver: local

services:
  # ============================================================================
  # SHIBBOLETH SP 3.4.1 SERVICE PROVIDER
  # ============================================================================
  shibboleth-sp:
    image: tier/shibboleth-sp:3.4.1
    container_name: ekredit-shibboleth-sp
    hostname: ccp.uii.ac.id

    environment:
      # Shibboleth SP Configuration
      SHIBBOLETH_SP_ENTITY_ID: https://ccp.uii.ac.id/shibboleth
      SHIBBOLETH_SP_SAMLDS_URL: https://idp.uii.ac.id/idp/shibboleth

      # Session Configuration
      SHIBBOLETH_SP_SESSION_LIFETIME: 28800  # 8 hours
      SHIBBOLETH_SP_SESSION_TIMEOUT: 3600    # 1 hour
      SHIBBOLETH_SP_SESSION_CHECK_ADDRESS: false
      SHIBBOLETH_SP_SESSION_CONSISTENT_ADDRESS: false

      # Security
      SHIBBOLETH_SP_HANDLERSSL: true
      SHIBBOLETH_SP_COOKIEPROPS: https

      # Metadata
      SHIBBOLETH_IDP_METADATA_URL: https://jagger.federasi.id/signedmetadata/federation/uiifederation/metadata.xml
      SHIBBOLETH_IDP_METADATA_BACKUP_FILE: /etc/shibboleth/metadata/uii-federation-metadata.xml

      # Attribute Mapping
      SHIBBOLETH_ATTRIBUTE_MAP: /etc/shibboleth/attribute-map.xml

    volumes:
      # Shibboleth Configuration Files
      - ./docker/shibboleth/shibboleth2.xml:/etc/shibboleth/shibboleth2.xml:ro
      - ./docker/shibboleth/attribute-map.xml:/etc/shibboleth/attribute-map.xml:ro
      - ./docker/shibboleth/attribute-policy.xml:/etc/shibboleth/attribute-policy.xml:ro

      # SP Certificates (for SAML signing)
      - ./docker/shibboleth/certs/sp-key.pem:/etc/shibboleth/sp-key.pem:ro
      - ./docker/shibboleth/certs/sp-cert.pem:/etc/shibboleth/sp-cert.pem:ro

      # Metadata Storage (downloaded from federation)
      - shibboleth-metadata:/etc/shibboleth/metadata

      # Logs
      - shibboleth-logs:/var/log/shibboleth

    # Expose FastCGI ports for Nginx
    ports:
      - "1600:1600"  # Authorizer (for authentication checks)
      - "1601:1601"  # Responder (for handling SAML responses)

    networks:
      - ekredit-network

    # Health check for Shibboleth daemon
    healthcheck:
      test: ["CMD", "pgrep", "-f", "shibd"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================================================
  # NGINX REVERSE PROXY WITH SHIBBOLETH FASTCGI
  # ============================================================================
  nginx-shibboleth:
    image: nginx:alpine
    container_name: ekredit-nginx-shibboleth
    hostname: ccp.uii.ac.id

    depends_on:
      shibboleth-sp:
        condition: service_healthy
      laravel-backend:
        condition: service_started

    ports:
      - "443:443"   # HTTPS
      - "80:80"     # HTTP (redirect to HTTPS)

    volumes:
      # Nginx Configuration
      - ./docker/nginx/nginx-shibboleth.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/includes:/etc/nginx/includes:ro

      # SSL Certificates (production)
      - ./docker/nginx/ssl/ccp.uii.ac.id.crt:/etc/nginx/ssl/server.crt:ro
      - ./docker/nginx/ssl/ccp.uii.ac.id.key:/etc/nginx/ssl/server.key:ro
      - ./docker/nginx/ssl/dhparam.pem:/etc/nginx/ssl/dhparam.pem:ro

      # Web Root (for static files)
      - ./web-client/dist:/var/www/html/public:ro

      # Logs
      - ./docker/nginx/logs:/var/log/nginx

    environment:
      # Nginx Configuration
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates

      # Backend Configuration
      BACKEND_HOST: laravel-backend
      BACKEND_PORT: 80

      # Shibboleth Configuration
      SHIBBOLETH_HOST: shibboleth-sp
      SHIBBOLETH_AUTHORIZER_PORT: 1600
      SHIBBOLETH_RESPONDER_PORT: 1601

    networks:
      - ekredit-network

    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================================================
  # LARAVEL BACKEND (existing container - reference)
  # ============================================================================
  laravel-backend:
    image: ekredit-laravel:latest
    container_name: ekredit-laravel-backend

    # This references the existing Laravel container from backend/docker-compose.yml
    # In production, build from backend directory:
    # docker build -t ekredit-laravel:latest ./backend

    build:
      context: ./e-kredit-pranata-ti/backend
      dockerfile: Dockerfile

    environment:
      # Laravel Configuration
      APP_NAME: "e-Kredit Pranata TI"
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: https://ccp.uii.ac.id

      # Database
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-ekredit}
      DB_USERNAME: ${DB_USERNAME:-ekredit_user}
      DB_PASSWORD: ${DB_PASSWORD}

      # Shibboleth Integration
      SHIBBOLETH_ENABLED: true
      SHIBBOLETH_HEADER_PREFIX: ${SHIBBOLETH_HEADER_PREFIX:-}

      # Session
      SESSION_DRIVER: redis
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis

      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: ${REDIS_PORT:-6379}

    volumes:
      # Application Code
      - ./e-kredit-pranata-ti/backend:/var/www/html

      # Storage (uploads, logs)
      - ./storage/app:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs

    networks:
      - ekredit-network

    restart: unless-stopped

  # ============================================================================
  # MYSQL DATABASE (existing - reference)
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: ekredit-mysql-prod

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-ekredit}
      MYSQL_USER: ${DB_USERNAME:-ekredit_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}

      # Performance Tuning
      MYSQL_INNODB_BUFFER_POOL_SIZE: 1G
      MYSQL_MAX_CONNECTIONS: 200

    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro

    networks:
      - ekredit-network

    # Health check
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3

    restart: unless-stopped

  # ============================================================================
  # REDIS CACHE & QUEUE (existing - reference)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ekredit-redis-prod

    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes

    volumes:
      - ./redis-data:/data

    networks:
      - ekredit-network

    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

    restart: unless-stopped

# ============================================================================
# PRODUCTION DEPLOYMENT NOTES
# ============================================================================

# 1. ENVIRONMENT VARIABLES
#    Create .env file in project root with:
#    - DB_PASSWORD=<secure_password>
#    - REDIS_PASSWORD=<secure_password>
#    - MYSQL_ROOT_PASSWORD=<secure_password>
#    - APP_KEY=<laravel_app_key>

# 2. SSL CERTIFICATES
#    Place SSL certificates in docker/nginx/ssl/:
#    - ccp.uii.ac.id.crt (SSL certificate)
#    - ccp.uii.ac.id.key (private key)
#    - dhparam.pem (Diffie-Hellman parameters)
#
#    Generate dhparam.pem:
#    openssl dhparam -out docker/nginx/ssl/dhparam.pem 2048

# 3. SHIBBOLETH SP CERTIFICATES
#    Generate SP certificates in docker/shibboleth/certs/:
#    openssl req -newkey rsa:3072 -new -x509 -days 3652 -nodes \
#      -out docker/shibboleth/certs/sp-cert.pem \
#      -keyout docker/shibboleth/certs/sp-key.pem \
#      -subj "/CN=ccp.uii.ac.id"

# 4. METADATA REGISTRATION
#    Register SP metadata with UII Federation (JAGGER):
#    https://ccp.uii.ac.id/Shibboleth.sso/Metadata
#
#    Submit to: https://jagger.federasi.id

# 5. DEPLOYMENT COMMANDS
#    # Build images
#    docker-compose -f docker-compose.shibboleth.yml build
#
#    # Start services
#    docker-compose -f docker-compose.shibboleth.yml up -d
#
#    # View logs
#    docker-compose -f docker-compose.shibboleth.yml logs -f
#
#    # Check status
#    docker-compose -f docker-compose.shibboleth.yml ps

# 6. POST-DEPLOYMENT VERIFICATION
#    # Check Shibboleth SP metadata
#    curl https://ccp.uii.ac.id/Shibboleth.sso/Metadata
#
#    # Check Shibboleth session
#    curl https://ccp.uii.ac.id/Shibboleth.sso/Session
#
#    # Test SSO login
#    Open browser: https://ccp.uii.ac.id/login
#    Click "Login with UII SSO"

# 7. MONITORING
#    # Shibboleth logs
#    docker exec ekredit-shibboleth-sp tail -f /var/log/shibboleth/shibd.log
#
#    # Nginx logs
#    docker exec ekredit-nginx-shibboleth tail -f /var/log/nginx/access.log
#
#    # Laravel logs
#    docker exec ekredit-laravel-backend tail -f /var/www/html/storage/logs/laravel.log

# 8. BACKUP & RECOVERY
#    # Database backup
#    docker exec ekredit-mysql-prod mysqldump -u root -p${MYSQL_ROOT_PASSWORD} ekredit > backup_$(date +%Y%m%d).sql
#
#    # Restore database
#    docker exec -i ekredit-mysql-prod mysql -u root -p${MYSQL_ROOT_PASSWORD} ekredit < backup_YYYYMMDD.sql

# 9. SCALING (Optional)
#    # Scale Laravel backend
#    docker-compose -f docker-compose.shibboleth.yml up -d --scale laravel-backend=3
#
#    # Nginx will load balance automatically

# 10. MAINTENANCE MODE
#     # Enable maintenance
#     docker exec ekredit-laravel-backend php artisan down
#
#     # Disable maintenance
#     docker exec ekredit-laravel-backend php artisan up
